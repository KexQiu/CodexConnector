name: Node compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.14.0', '22', '24.0.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck && pnpm desktop:typecheck && pnpm lint
      - run: pnpm test && pnpm check:sqlite
      - name: Build desktop with its pinned backend runtime
        run: pnpm desktop:build
