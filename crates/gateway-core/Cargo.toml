[package]
name = "codexconnector-core"
version = "0.2.0-alpha.1"
edition = "2021"
rust-version = "1.90"
description = "CodexConnector Rust gateway persistence and compatibility core"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
